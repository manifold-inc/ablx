[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ablx"
version = "0.1.0"
description = "Deterministic weight-space upscaling tools for MoE language model checkpoints."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
  { name = "Manifold Research" }
]
dependencies = [
  "numpy>=1.24",
  "PyYAML>=6.0"
]

[project.optional-dependencies]
hf = [
  "huggingface-hub>=0.26"
]
probe = [
  "torch",
  "transformers>=4.57"
]
bench = [
  "lm-eval"
]
dev = [
  "pytest>=8",
  "safetensors>=0.5"
]

[project.scripts]
ablx = "ablx.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
